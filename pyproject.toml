[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "avatar-forge-talking-head"
version = "0.4.2"
description = "AI avatar / talking-head generator: still image + audio -> lip-synced video"
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "avatar-forge contributors" }]
keywords = ["ai-avatar", "talking-head", "lipsync", "wav2lip", "face-rig", "video-generation"]

dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "soundfile>=0.12",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "onnxruntime-gpu>=1.17; sys_platform == 'win32'",
    "onnxruntime>=1.17; sys_platform != 'win32'",
    "pillow>=10.2",
    "imageio-ffmpeg>=0.4.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.10"]
cuda = ["torch>=2.2"]

[project.scripts]
avatar-forge = "avatar_forge.bootstrap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["avatar_forge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=avatar_forge --cov-report=term-missing"